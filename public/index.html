<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Email Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-w: 220px;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --bg: #f8f9fb;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --grey-bg: #f3f4f6;
    --radius: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w);
    background: #1e1b4b;
    color: #c7d2fe;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    height: 100vh;
    z-index: 10;
  }
  .sidebar-logo {
    padding: 28px 24px 20px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar-logo span { color: #818cf8; }
  .sidebar-nav { padding: 16px 12px; flex: 1; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: #a5b4fc;
    transition: background 0.15s, color 0.15s;
    user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .nav-item.active { background: var(--accent); color: #fff; }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }

  /* ── Main ── */
  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    padding: 32px 36px;
    max-width: 1200px;
  }

  .page { display: none; }
  .page.active { display: block; }

  .page-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--text);
  }

  /* ── Stat cards ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
  }
  .stat-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .stat-value.rate { color: var(--accent); }

  /* ── Chart card ── */
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .chart-title { font-size: 15px; font-weight: 600; }
  .range-tabs { display: flex; gap: 4px; }
  .range-tab {
    padding: 5px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all 0.15s;
  }
  .range-tab:hover { background: var(--bg); }
  .range-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chart-wrap { position: relative; height: 240px; }

  /* ── Card ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  /* ── Form ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 13px; font-weight: 500; color: var(--muted); }
  input, textarea {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    transition: border 0.15s;
    font-family: inherit;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 100px; }
  .btn {
    padding: 9px 22px;
    border-radius: 7px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-outline:hover { background: var(--bg); }
  .form-footer {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 16px;
  }
  .send-status { font-size: 13px; }
  .send-status.ok  { color: var(--green); }
  .send-status.err { color: #dc2626; }

  /* ── Table ── */
  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .table-header-title { font-size: 15px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 10px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .status-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-pill.opened  { background: var(--green-bg); color: var(--green); }
  .status-pill.pending { background: var(--grey-bg);  color: var(--muted); }
  .truncate {
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty-row td { text-align: center; padding: 40px; color: var(--muted); }

  /* ── Pagination ── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-top: 16px;
  }
  .pg-btn {
    padding: 5px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    background: #fff;
    color: var(--text);
    transition: all 0.12s;
  }
  .pg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pg-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .pg-info { font-size: 13px; color: var(--muted); margin-right: 8px; }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">Email<span>Tracker</span></div>
  <nav class="sidebar-nav">
    <div class="nav-item active" id="nav-home" onclick="showPage('home')">
      <span class="nav-icon">&#9783;</span> Home
    </div>
    <div class="nav-item" id="nav-emails" onclick="showPage('emails')">
      <span class="nav-icon">&#9993;</span> Emails
    </div>
  </nav>
</aside>

<!-- Main -->
<main class="main">

  <!-- HOME PAGE -->
  <section class="page active" id="page-home">
    <h1 class="page-title">Dashboard</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Sent</div>
        <div class="stat-value" id="stat-sent">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Opened</div>
        <div class="stat-value" id="stat-opened">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Open Rate</div>
        <div class="stat-value rate" id="stat-rate">—</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Sent vs Opened</div>
        <div class="range-tabs">
          <button class="range-tab active" onclick="setRange('week')">Week</button>
          <button class="range-tab" onclick="setRange('month')">Month</button>
          <button class="range-tab" onclick="setRange('year')">Year</button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="emailChart"></canvas>
      </div>
    </div>
  </section>

  <!-- EMAILS PAGE -->
  <section class="page" id="page-emails">
    <h1 class="page-title">Emails</h1>

    <!-- Send form -->
    <div class="card">
      <div class="card-title">Send Tracked Email</div>
      <form id="sendForm" onsubmit="sendEmail(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="companyName">Company Name</label>
            <input id="companyName" type="text" placeholder="Acme Corp" required />
          </div>
          <div class="form-group">
            <label for="recipientName">Recipient Name</label>
            <input id="recipientName" type="text" placeholder="John Smith" required />
          </div>
          <div class="form-group">
            <label for="toEmail">To (Email)</label>
            <input id="toEmail" type="email" placeholder="client@example.com" required />
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input id="subject" type="text" placeholder="Partnership Opportunity" required />
          </div>
          <div class="form-group full">
            <label for="body">Message</label>
            <textarea id="body" placeholder="Write your email body here..." required></textarea>
          </div>
        </div>
        <div class="form-footer">
          <button class="btn btn-primary" type="submit" id="sendBtn">Send Email</button>
          <span class="send-status" id="sendStatus"></span>
        </div>
      </form>
    </div>

    <!-- Emails table -->
    <div class="card">
      <div class="table-header">
        <div class="table-header-title">Sent Emails</div>
        <button class="btn btn-outline btn-sm" onclick="loadEmails()">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Company</th>
              <th>Recipient</th>
              <th>Email</th>
              <th>Subject</th>
              <th>Status</th>
              <th>Sent At</th>
              <th>Opened At</th>
            </tr>
          </thead>
          <tbody id="emailTableBody">
            <tr class="empty-row"><td colspan="8">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </section>

</main>

<script>
// ── State ──
let chartInstance = null;
let chartData     = null;
let currentRange  = "week";
let currentPage   = 1;

// ── Navigation ──
function showPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.getElementById("page-" + page).classList.add("active");
  document.getElementById("nav-" + page).classList.add("active");
  if (page === "home")   loadStats();
  if (page === "emails") loadEmails();
}

// ── Stats / Chart ──
async function loadStats() {
  try {
    const r    = await fetch("/api/stats");
    const data = await r.json();
    if (data.error) throw new Error(data.error);

    document.getElementById("stat-sent").textContent   = data.totalSent;
    document.getElementById("stat-opened").textContent = data.totalOpened;
    const rate = data.totalSent > 0
      ? Math.round((data.totalOpened / data.totalSent) * 100) + "%"
      : "0%";
    document.getElementById("stat-rate").textContent = rate;

    chartData = data.chart;
    renderChart(currentRange);
  } catch (e) {
    console.error("Stats error:", e);
  }
}

function setRange(range) {
  currentRange = range;
  document.querySelectorAll(".range-tab").forEach(t => {
    t.classList.toggle("active", t.textContent.toLowerCase() === range);
  });
  if (chartData) renderChart(range);
}

function renderChart(range) {
  const d   = chartData[range];
  const ctx = document.getElementById("emailChart").getContext("2d");
  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: d.labels,
      datasets: [
        {
          label: "Sent",
          data: d.sent,
          borderColor: "#4f46e5",
          backgroundColor: "rgba(79,70,229,0.08)",
          tension: 0.35,
          fill: true,
          pointRadius: 3,
        },
        {
          label: "Opened",
          data: d.opened,
          borderColor: "#16a34a",
          backgroundColor: "rgba(22,163,74,0.08)",
          tension: 0.35,
          fill: true,
          pointRadius: 3,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0 } },
        x: { grid: { display: false } },
      },
    },
  });
}

// ── Send Email ──
async function sendEmail(e) {
  e.preventDefault();
  const btn    = document.getElementById("sendBtn");
  const status = document.getElementById("sendStatus");
  btn.disabled = true;
  status.textContent = "Sending…";
  status.className   = "send-status";

  try {
    const r = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        companyName:   document.getElementById("companyName").value.trim(),
        recipientName: document.getElementById("recipientName").value.trim(),
        to:            document.getElementById("toEmail").value.trim(),
        subject:       document.getElementById("subject").value.trim(),
        body:          document.getElementById("body").value.trim(),
      }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Unknown error");

    status.textContent = "Email sent successfully!";
    status.className   = "send-status ok";
    document.getElementById("sendForm").reset();
    loadEmails();
  } catch (err) {
    status.textContent = "Error: " + err.message;
    status.className   = "send-status err";
  } finally {
    btn.disabled = false;
  }
}

// ── Emails Table ──
async function loadEmails(page) {
  if (page !== undefined) currentPage = page;
  const tbody = document.getElementById("emailTableBody");
  tbody.innerHTML = '<tr class="empty-row"><td colspan="8">Loading...</td></tr>';

  try {
    const r    = await fetch(`/api/emails?page=${currentPage}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);

    renderTable(data.emails);
    renderPagination(data.page, data.totalPages);
  } catch (err) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="8">Error: ${esc(err.message)}</td></tr>`;
  }
}

function renderTable(emails) {
  const tbody  = document.getElementById("emailTableBody");
  const offset = (currentPage - 1) * 50;

  if (!emails || !emails.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">No emails sent yet.</td></tr>';
    return;
  }

  tbody.innerHTML = emails.map((em, i) => `
    <tr>
      <td>${offset + i + 1}</td>
      <td class="truncate" title="${esc(em.company_name)}">${esc(em.company_name)}</td>
      <td class="truncate" title="${esc(em.recipient_name)}">${esc(em.recipient_name)}</td>
      <td class="truncate" title="${esc(em.email_to)}">${esc(em.email_to)}</td>
      <td class="truncate" title="${esc(em.subject)}">${esc(em.subject)}</td>
      <td><span class="status-pill ${em.status.toLowerCase()}">${em.status}</span></td>
      <td style="white-space:nowrap">${fmtDate(em.sent_at)}</td>
      <td style="white-space:nowrap">${em.opened_at ? fmtDate(em.opened_at) : "—"}</td>
    </tr>
  `).join("");
}

function renderPagination(page, totalPages) {
  const el = document.getElementById("pagination");
  if (totalPages <= 1) { el.innerHTML = ""; return; }

  let html = `<span class="pg-info">Page ${page} of ${totalPages}</span>`;
  html += `<button class="pg-btn" onclick="loadEmails(${page - 1})" ${page <= 1 ? "disabled" : ""}>&lsaquo; Prev</button>`;

  for (const p of paginationRange(page, totalPages)) {
    if (p === "…") {
      html += `<button class="pg-btn" disabled>…</button>`;
    } else {
      html += `<button class="pg-btn ${p === page ? "active" : ""}" onclick="loadEmails(${p})">${p}</button>`;
    }
  }

  html += `<button class="pg-btn" onclick="loadEmails(${page + 1})" ${page >= totalPages ? "disabled" : ""}>Next &rsaquo;</button>`;
  el.innerHTML = html;
}

function paginationRange(current, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const pages = [1];
  if (current > 3) pages.push("…");
  for (let p = Math.max(2, current - 1); p <= Math.min(total - 1, current + 1); p++) pages.push(p);
  if (current < total - 2) pages.push("…");
  pages.push(total);
  return pages;
}

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })
    + " " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
}

// Init
loadStats();
</script>
</body>
</html>
